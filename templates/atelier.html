<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <title>Atelier - métrologie</title>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        body {
            background-color: #fdfdfd;
            color: #222;
            font-family: Georgia, serif;
            margin: 0;
            padding: 0;
        }

        nav {
            display: flex;
            justify-content: center;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: #fff;
        }

        nav a {
            margin: 0 1rem;
            text-decoration: none;
            color: #444;
            font-size: 0.9rem;
            text-transform: lowercase;
        }

        .container {
            max-width: 600px;
            margin: 3rem auto;
            padding: 3rem;
            border: 1px solid #eee;
            text-align: center;
        }

        h1 {
            font-weight: normal;
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }

        #chart {
            display: inline-block;
        }

        .info {
            margin-top: 2rem;
            font-style: italic;
            color: #666;
        }
    </style>
</head>

<body>
    <nav>
        <a href="/">accueil</a>
        <a href="/rapport">rapport</a>
        <a href="/histogramme">histogramme</a>
        <a href="/atelier">atelier</a>
        <a href="/contact">contact</a>
    </nav>
    <div class="container">
        <h1>Vitesse du vent à Marseille</h1>
        <div id="chart"></div>
        <div class="info" id="value">Analyse en cours...</div>
    </div>
    <script>
        google.charts.load('current', { packages: ['gauge'] });
        google.charts.setOnLoadCallback(init);
        async function init() {
            try {
                const res = await fetch('/marseille/vent');
                const json = await res.json();
                const speed = json.wind_speed;
                const data = google.visualization.arrayToDataTable([['Label', 'Value'], ['km/h', speed]]);
                const options = { width: 300, height: 240, minorTicks: 5 };
                const chart = new google.visualization.Gauge(document.getElementById('chart'));
                chart.draw(data, options);
                document.getElementById('value').textContent = `Vent mesuré : ${speed} km/h`;
            } catch (err) { document.getElementById('value').textContent = "Erreur de connexion"; }
        }
    </script>
</body>

</html>
