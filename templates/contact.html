<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Contact - métrologie</title>
    <style>
        body {
            background-color: #fdfdfd;
            color: #222;
            font-family: Georgia, serif;
            margin: 0;
            padding: 0;
        }

        nav {
            display: flex;
            justify-content: center;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: #fff;
        }

        nav a {
            margin: 0 1rem;
            text-decoration: none;
            color: #444;
            font-size: 0.9rem;
            text-transform: lowercase;
        }

        .container {
            max-width: 500px;
            margin: 4rem auto;
            padding: 2.5rem;
            border: 1px solid #eee;
            background: #fff;
        }

        h1 {
            font-weight: normal;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #666;
        }

        input,
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 2px;
            box-sizing: border-box;
            font-family: inherit;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: #222;
            color: #fff;
            border: none;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 1px;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>
    <nav>
        <a href="/">accueil</a>
        <a href="/rapport">rapport</a>
        <a href="/histogramme">histogramme</a>
        <a href="/atelier">atelier</a>
        <a href="/contact">contact</a>
    </nav>
    <div class="container">
        <h1>Formulaire de contact</h1>
        <div class="form-group">
            <label>Nom</label>
            <input type="text" placeholder="...">
        </div>
        <div class="form-group">
            <label>Prénom</label>
            <input type="text" placeholder="...">
        </div>
        <div class="form-group">
            <label>Message</label>
            <textarea rows="5" placeholder="Votre texte ici"></textarea>
        </div>
        <button onclick="alert('Message transmis.')">Envoyer</button>
    </div>
</body>

</html>
