<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Contactez-nous</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .contact-form {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 400px;
        }

        h1 {
            color: #4a5568;
            text-align: center;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #718096;
            font-size: 0.9em;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
        }

        button:hover {
            background: #5a67d8;
        }
    </style>
</head>

<body>
    <div class="contact-form">
        <h1>Me Contacter ✉️</h1>
        <div class="input-group">
            <label>Nom</label>
            <input type="text" placeholder="Votre nom">
        </div>
        <div class="input-group">
            <label>Prénom</label>
            <input type="text" placeholder="Votre prénom">
        </div>
        <div class="input-group">
            <label>Message</label>
            <textarea rows="4" placeholder="Votre message..."></textarea>
        </div>
        <button onclick="alert('Merci ! (Simulation d\'envoi)')">Envoyer</button>
    </div>
</body>

</html>
