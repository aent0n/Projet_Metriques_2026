<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rapport - métrologie</title>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        nav {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.9375rem;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--primary);
        }

        .container {
            max-width: 1100px;
            margin: 3rem auto;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 0.75rem;
            border: 1px solid var(--border);
        }

        h1 {
            color: var(--text-main);
            margin: 0 0 2rem;
            font-size: 1.5rem;
            text-align: center;
        }

        #chart {
            width: 100%;
            height: 500px;
        }

        #status {
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>

<body>
    <nav>
        <a href="/">Accueil</a>
        <a href="/rapport">Rapport</a>
        <a href="/histogramme">Histogramme</a>
        <a href="/atelier">Atelier</a>
        <a href="/contact">Contact</a>
    </nav>
    <div class="container">
        <h1>Températures horaires à Paris</h1>
        <div id="chart"></div>
        <div id="status">Chargement des données en cours...</div>
    </div>

    <script>
        google.charts.load('current', { packages: ['corechart'] });
        google.charts.setOnLoadCallback(init);

        async function init() {
            try {
                const rows = await fetchParisData();
                drawChart(rows);
                window.addEventListener('resize', () => drawChart(rows));
            } catch (err) {
                document.getElementById('status').textContent = "Erreur lors de la récupération : " + err.message;
            }
        }

        async function fetchParisData() {
            const res = await fetch('/paris');
            if (!res.ok) throw new Error(`Status HTTP ${res.status}`);
            const json = await res.json();
            return json.map(p => [new Date(p.datetime), p.temperature_c]);
        }

        function drawChart(rows) {
            const data = new google.visualization.DataTable();
            data.addColumn('datetime', 'Date');
            data.addColumn('number', 'Température (°C)');
            data.addRows(rows);

            const options = {
                curveType: 'function',
                legend: { position: 'bottom' },
                hAxis: { format: 'dd/MM HH:mm', gridlines: { color: '#f1f5f9' } },
                vAxis: { title: 'Degrés Celsius', gridlines: { color: '#f1f5f9' } },
                colors: ['#2563eb'],
                chartArea: { width: '85%', height: '70%' },
                backgroundColor: 'transparent'
            };

            const chart = new google.visualization.LineChart(document.getElementById('chart'));
            chart.draw(data, options);
            document.getElementById('status').textContent = `Dernière mise à jour : ${new Date().toLocaleTimeString()} (${rows.length} points)`;
        }
    </script>
</body>

</html>
