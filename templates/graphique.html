<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Températures Paris — Graphique</title>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1a73e8;
            text-align: center;
            margin-bottom: 30px;
        }

        #chart {
            width: 100%;
            height: 500px;
        }

        #status {
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
            text-align: center;
        }

        .nav {
            margin-bottom: 20px;
            text-align: center;
        }

        .nav a {
            margin: 0 10px;
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
        }

        .nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="nav">
            <a href="/">Accueil</a>
            <a href="/histogramme">Histogramme</a>
            <a href="/atelier">Atelier (Vent)</a>
            <a href="/contact">Contact</a>
        </div>
        <h1>Températures horaires — Paris (7 jours)</h1>
        <div id="chart"></div>
        <div id="status">Chargement des données...</div>
    </div>

    <script>
        google.charts.load('current', { packages: ['corechart'] });
        google.charts.setOnLoadCallback(init);

        async function init() {
            try {
                const rows = await fetchParisData();
                drawChart(rows);
                window.addEventListener('resize', () => drawChart(rows));
            } catch (err) {
                document.getElementById('status').textContent = "Erreur: " + err.message;
            }
        }

        async function fetchParisData() {
            const res = await fetch('/paris');
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            return json.map(p => [new Date(p.datetime), p.temperature_c]);
        }

        function drawChart(rows) {
            const data = new google.visualization.DataTable();
            data.addColumn('datetime', 'Date/Heure');
            data.addColumn('number', 'Température (°C)');
            data.addRows(rows);

            const options = {
                title: 'Évolution des températures',
                curveType: 'function',
                legend: { position: 'bottom' },
                hAxis: { format: 'dd/MM HH:mm', gridlines: { count: 10 } },
                vAxis: { title: '°C' },
                colors: ['#4285f4'],
                chartArea: { width: '85%', height: '70%' }
            };

            const chart = new google.visualization.LineChart(document.getElementById('chart'));
            chart.draw(data, options);
            document.getElementById('status').textContent = `Dernière mise à jour : ${new Date().toLocaleTimeString()} (${rows.length} points)`;
        }
    </script>
</body>

</html>
