<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <title>Rapport - métrologie</title>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        body {
            background-color: #fdfdfd;
            color: #222;
            font-family: Georgia, serif;
            margin: 0;
            padding: 0;
        }

        nav {
            display: flex;
            justify-content: center;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: #fff;
        }

        nav a {
            margin: 0 1rem;
            text-decoration: none;
            color: #444;
            font-size: 0.9rem;
            text-transform: lowercase;
        }

        .container {
            max-width: 900px;
            margin: 3rem auto;
            padding: 2rem;
            border: 1px solid #eee;
        }

        h1 {
            font-weight: normal;
            font-size: 1.5rem;
            border-bottom: 1px solid #222;
            padding-bottom: 1rem;
        }

        #chart {
            width: 100%;
            height: 500px;
            margin-top: 2rem;
        }

        #status {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #888;
            font-style: italic;
        }
    </style>
</head>

<body>
    <nav>
        <a href="/">accueil</a>
        <a href="/rapport">rapport</a>
        <a href="/histogramme">histogramme</a>
        <a href="/atelier">atelier</a>
        <a href="/contact">contact</a>
    </nav>
    <div class="container">
        <h1>Températures à Paris</h1>
        <div id="chart"></div>
        <div id="status">Chargement...</div>
    </div>

    <script>
        google.charts.load('current', { packages: ['corechart'] });
        google.charts.setOnLoadCallback(init);
        async function fetchParisData() {
            const res = await fetch('/paris');
            const json = await res.json();
            return json.map(p => [new Date(p.datetime), p.temperature_c]);
        }
        function drawChart(rows) {
            const data = new google.visualization.DataTable();
            data.addColumn('datetime', 'Date');
            data.addColumn('number', 'Température (°C)');
            data.addRows(rows);
            const options = {
                curveType: 'function',
                legend: { position: 'bottom' },
                hAxis: { gridlines: { color: '#f9f9f9' } },
                vAxis: { gridlines: { color: '#f9f9f9' } },
                colors: ['#222'],
                backgroundColor: 'transparent',
                chartArea: { width: '85%', height: '70% ' }
            };
            const chart = new google.visualization.LineChart(document.getElementById('chart'));
            chart.draw(data, options);
            document.getElementById('status').textContent = `Mise à jour : ${new Date().toLocaleTimeString()}`;
        }
        async function init() {
            try {
                const rows = await fetchParisData();
                drawChart(rows);
            } catch (err) { document.getElementById('status').textContent = "Erreur"; }
        }
    </script>
</body>

</html>
