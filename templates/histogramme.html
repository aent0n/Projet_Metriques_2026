<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <title>Histogramme - métrologie</title>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        body {
            background-color: #fdfdfd;
            color: #222;
            font-family: Georgia, serif;
            margin: 0;
            padding: 0;
        }

        nav {
            display: flex;
            justify-content: center;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            background: #fff;
        }

        nav a {
            margin: 0 1rem;
            text-decoration: none;
            color: #444;
            font-size: 0.9rem;
            text-transform: lowercase;
        }

        .container {
            max-width: 900px;
            margin: 3rem auto;
            padding: 2rem;
            border: 1px solid #eee;
        }

        h1 {
            font-weight: normal;
            font-size: 1.5rem;
            border-bottom: 1px solid #222;
            padding-bottom: 1rem;
        }

        #chart {
            width: 100%;
            height: 500px;
            margin-top: 2rem;
        }
    </style>
</head>

<body>
    <nav>
        <a href="/">accueil</a>
        <a href="/rapport">rapport</a>
        <a href="/histogramme">histogramme</a>
        <a href="/atelier">atelier</a>
        <a href="/contact">contact</a>
    </nav>
    <div class="container">
        <h1>Distribution des relevés</h1>
        <div id="chart"></div>
    </div>
    <script>
        google.charts.load('current', { packages: ['corechart'] });
        google.charts.setOnLoadCallback(init);
        async function init() {
            const res = await fetch('/paris');
            const json = await res.json();
            const rows = json.map(p => [p.datetime, p.temperature_c]);
            const data = google.visualization.arrayToDataTable([['Date', 'Température'], ...rows.slice(0, 24)]);
            const options = { legend: 'none', colors: ['#444'], backgroundColor: 'transparent', hAxis: { slantedText: true } };
            const chart = new google.visualization.ColumnChart(document.getElementById('chart'));
            chart.draw(data, options);
        }
    </script>
</body>

</html>
