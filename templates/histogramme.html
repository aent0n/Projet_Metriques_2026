<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <title>Histogramme - métrologie</title>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.5;
        }

        nav {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.9375rem;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--primary);
        }

        .container {
            max-width: 1100px;
            margin: 3rem auto;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 0.75rem;
            border: 1px solid var(--border);
        }

        h1 {
            color: var(--text-main);
            margin: 0 0 2rem;
            font-size: 1.5rem;
            text-align: center;
        }

        #chart {
            width: 100%;
            height: 500px;
        }
    </style>
</head>

<body>
    <nav>
        <a href="/">Accueil</a>
        <a href="/rapport">Rapport</a>
        <a href="/histogramme">Histogramme</a>
        <a href="/atelier">Atelier</a>
        <a href="/contact">Contact</a>
    </nav>
    <div class="container">
        <h1>Distribution des températures</h1>
        <div id="chart"></div>
    </div>

    <script>
        google.charts.load('current', { packages: ['corechart'] });
        google.charts.setOnLoadCallback(init);

        async function init() {
            try {
                const res = await fetch('/paris');
                const json = await res.json();
                const rows = json.map(p => [p.datetime, p.temperature_c]);

                const data = google.visualization.arrayToDataTable([
                    ['Date', 'Température'],
                    ...rows.slice(0, 24)
                ]);

                const options = {
                    legend: { position: 'none' },
                    colors: ['#2563eb'],
                    hAxis: { slantedText: true, slantedTextAngle: 45, textStyle: { fontSize: 10 } },
                    vAxis: { title: '°C' },
                    backgroundColor: 'transparent',
                    chartArea: { width: '85%', height: '70% ' }
                };

                const chart = new google.visualization.ColumnChart(document.getElementById('chart'));
                chart.draw(data, options);
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>

</html>
